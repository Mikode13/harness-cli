<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="454" viewBox="0 0 1070 454" role="img"><title>Acciones de sesión</title><rect width="1070" height="454" fill="#111719"/><rect width="1070" height="42" fill="#202a2b"/><text x="20" y="28" fill="#efeadf" font-family="ui-monospace,Consolas,monospace" font-size="19" font-weight="bold" xml:space="preserve">metis  |  harness-cli</text><text x="550" y="28" fill="#a7c8cf" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">NUBE   cli-07   ·   Borradores</text><path d="M0 42h1070 M532 95v337" stroke="#446454"/><text x="20" y="80" fill="#f0efe6" font-family="ui-monospace,Consolas,monospace" font-size="23" font-weight="bold" xml:space="preserve">Acciones de sesión</text><text x="20" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Menú de sesión</text><text x="20" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Renombrar sesión…</text><text x="20" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Archivar y empezar conversación…</text><text x="20" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Abrir conversaciones archivadas ▸</text><text x="20" y="224" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Borrar sesión…</text><text x="20" y="248" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="20" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Archivo de esta sesión</text><text x="20" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  24 nov   Revisión del borrador</text><text x="20" y="320" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  22 nov   Contrato de eventos</text><text x="20" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  [Abrir para leer]</text><text x="552" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Confirmaciones</text><text x="552" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Archivar y empezar conversación</text><text x="552" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">El chat actual quedará en el archivo.</text><text x="552" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Seguirás en la rama feat/borradores.</text><text x="552" y="224" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[Archivar y empezar]   [Volver]</text><text x="552" y="248" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Borrar «Borradores»</text><text x="552" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">La sesión dejará de aparecer en tus chats.</text><text x="552" y="320" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[Borrar sesión]        [Volver]</text><text x="552" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="368" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Si el workspace está ocupado, ambas</text><text x="552" y="392" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">acciones quedan desactivadas.</text></svg>