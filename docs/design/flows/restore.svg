<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="454" viewBox="0 0 1070 454" role="img"><title>Restaurar código</title><rect width="1070" height="454" fill="#111719"/><rect width="1070" height="42" fill="#202a2b"/><text x="20" y="28" fill="#efeadf" font-family="ui-monospace,Consolas,monospace" font-size="19" font-weight="bold" xml:space="preserve">metis  |  harness-cli</text><text x="550" y="28" fill="#a7c8cf" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Acciones del prompt #02   ·   cli-07</text><path d="M0 42h1070 M532 95v337" stroke="#446454"/><text x="20" y="80" fill="#f0efe6" font-family="ui-monospace,Consolas,monospace" font-size="23" font-weight="bold" xml:space="preserve">Restaurar código</text><text x="20" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Con un run activo</text><text x="20" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Destino   Después del turno #02</text><text x="20" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Actual    Después del turno #03</text><text x="20" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="20" y="224" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[Ver diff del turno #03]</text><text x="20" y="248" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[Restaurar: desactivado]</text><text x="20" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  Hay un run activo en este workspace.</text><text x="20" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="20" y="320" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Cuando quede libre, vuelve a confirmar</text><text x="20" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">si aún quieres restaurar el código.</text><text x="552" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Workspace libre · commits locales aptos</text><text x="552" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Destino   Después del turno #02</text><text x="552" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Se desharán los cambios del turno #03.</text><text x="552" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="224" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">(●) Conservar commits</text><text x="552" y="248" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">( ) Crear commits de reversión</text><text x="552" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">( ) Mover la rama a antes de los commits</text><text x="552" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="320" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[Confirmar restauración]   [Volver]</text><text x="552" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="368" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Los mensajes siguen en el chat. En el</text><text x="552" y="392" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">siguiente turno el agente recibirá qué</text><text x="552" y="416" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">se restauró y qué ocurrió en Git.</text></svg>