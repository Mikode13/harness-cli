<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="454" viewBox="0 0 1070 454" role="img"><title>Estados de sesión</title><rect width="1070" height="454" fill="#111719"/><rect width="1070" height="42" fill="#202a2b"/><text x="20" y="28" fill="#efeadf" font-family="ui-monospace,Consolas,monospace" font-size="19" font-weight="bold" xml:space="preserve">metis  |  harness-cli</text><text x="550" y="28" fill="#a7c8cf" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Lista de chats · estados de ejemplo</text><path d="M0 42h1070 M532 95v337" stroke="#446454"/><text x="20" y="80" fill="#f0efe6" font-family="ui-monospace,Consolas,monospace" font-size="23" font-weight="bold" xml:space="preserve">Estados de sesión</text><text x="20" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Estado del último run</text><text x="20" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">● Preparando        · preparando el workspace</text><text x="20" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">● Trabajando        · run activo</text><text x="20" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">● Espera respuesta  · abrir pregunta</text><text x="20" y="224" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">● Cancelando        · esperando al ejecutor</text><text x="20" y="248" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">○ Cancelado         · cancelación confirmada</text><text x="20" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">✓ Completado        · resultado disponible</text><text x="20" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">× Fallido           · abrir error</text><text x="20" y="320" fill="#efc587" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">! Interrumpido      · ver motivo</text><text x="552" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Operación del workspace</text><text x="552" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Restaurando código…</text><text x="552" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  [Ver diff]      [Restaurar: desactivado]</text><text x="552" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="224" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Publicando cambios…</text><text x="552" y="248" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  harness-cli   publicado</text><text x="552" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  harness-api   en curso</text><text x="552" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="320" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Durante ambas operaciones:</text><text x="552" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  envío, clear y borrado desactivados.</text><text x="552" y="368" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  La operación continuará hasta su fin.</text></svg>