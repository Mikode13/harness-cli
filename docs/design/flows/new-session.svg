<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="454" viewBox="0 0 1070 454" role="img"><title>Nuevo chat</title><rect width="1070" height="454" fill="#111719"/><rect width="1070" height="42" fill="#202a2b"/><text x="20" y="28" fill="#efeadf" font-family="ui-monospace,Consolas,monospace" font-size="19" font-weight="bold" xml:space="preserve">metis  |  harness-cli</text><text x="550" y="28" fill="#a7c8cf" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Borrador local de una sesión en nube</text><path d="M0 42h1070 M532 95v337" stroke="#446454"/><text x="20" y="80" fill="#f0efe6" font-family="ui-monospace,Consolas,monospace" font-size="23" font-weight="bold" xml:space="preserve">Nuevo chat</text><text x="20" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Seleccionar proyectos</text><text x="20" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Proyectos registrados</text><text x="20" y="176" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[×] harness-cli    ↳ coincide con el remote</text><text x="20" y="200" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[×] harness-api</text><text x="20" y="224" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[ ] Ninguno · conversación sin código</text><text x="20" y="248" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="20" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Rama inicial: main</text><text x="20" y="296" fill="#efc587" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">! Hay cambios locales sin subir.</text><text x="20" y="320" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  El servidor usará la versión publicada.</text><text x="20" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="20" y="368" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[Confirmar selección]</text><text x="552" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Primer prompt enviado</text><text x="552" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">NUBE   cli-07   ·   2 proyectos ▾</text><text x="552" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  harness-cli      main</text><text x="552" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  harness-api      main</text><text x="552" y="224" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="248" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">TÚ   Haz compatible el cliente con la API.</text><text x="552" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">● Preparando</text><text x="552" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  Preparando los worktrees del servidor.</text><text x="552" y="320" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Con «Ninguno», la cabecera indica</text><text x="552" y="368" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">«Sin proyectos» y se ocultan Push y PR.</text></svg>