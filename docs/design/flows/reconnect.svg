<svg xmlns="http://www.w3.org/2000/svg" width="1070" height="454" viewBox="0 0 1070 454" role="img"><title>Conexión con la nube</title><rect width="1070" height="454" fill="#111719"/><rect width="1070" height="42" fill="#202a2b"/><text x="20" y="28" fill="#efeadf" font-family="ui-monospace,Consolas,monospace" font-size="19" font-weight="bold" xml:space="preserve">metis  |  harness-cli</text><text x="550" y="28" fill="#a7c8cf" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">NUBE   cli-07   ·   Estado y conexión</text><path d="M0 42h1070 M532 95v337" stroke="#446454"/><text x="20" y="80" fill="#f0efe6" font-family="ui-monospace,Consolas,monospace" font-size="23" font-weight="bold" xml:space="preserve">Conexión con la nube</text><text x="20" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Durante un corte</text><text x="20" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Sin conexión · último evento recibido #41</text><text x="20" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Último estado conocido: Trabajando</text><text x="20" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="20" y="224" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Borrador conservado</text><text x="20" y="248" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">› Prueba también la reconexión.▏</text><text x="20" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="20" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Reconectando…</text><text x="20" y="320" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">  Recuperando eventos posteriores a #41.</text><text x="20" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="20" y="368" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Cerrar el cliente deja el run en el servidor.</text><text x="552" y="118" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="17" font-weight="bold" xml:space="preserve">Tras reconectar</text><text x="552" y="152" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">#42   Actividad recuperada</text><text x="552" y="176" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">#43   Interrumpido · la API se reinició</text><text x="552" y="200" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">      Se cerró la pregunta pendiente.</text><text x="552" y="224" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="248" fill="#a7dcc3" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">[Ver historial]  [Ver cambios registrados]</text><text x="552" y="272" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="296" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Cuando el workspace vuelva a estar libre,</text><text x="552" y="320" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">puedes decidir el siguiente prompt.</text><text x="552" y="344" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve"></text><text x="552" y="368" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">Si solo se perdió la conexión, se muestra</text><text x="552" y="392" fill="#dce1dc" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="normal" xml:space="preserve">el estado recibido del servidor.</text></svg>