name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: CI
    uses: Mikode13/.github/.github/workflows/ci.yml@04cbe17051083ce1d74fe71dbb2bb126885a08d6
    with:
      source: true
      tests: true
      build: true
      package: true
      documentation: true

  node26:
    name: CLI and terminal UI (Node.js 26.4)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.17.0
          install: false
          runtime: node@26.4.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run test:tui
